<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="IIDZII Reader - A bold e-book reader supporting TXT, PDF, DOCX, and EPUB">
  <meta name="theme-color" content="#1A1A2E">
  <title>IIDZII Reader</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%231A1A2E'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%2300E5FF' font-family='sans-serif' font-weight='bold'>I</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Mammoth.js for DOCX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <!-- JSZip for EPUB -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

  <!-- Reading Progress Bar -->
  <div id="progress-bar" role="progressbar" aria-label="Reading progress"></div>

  <!-- ==================== HOME SCREEN ==================== -->
  <div id="home-screen">
    
    <!-- Header -->
    <header id="home-header">
      <div class="header-brand">
        <div class="logo-mark">I</div>
        <div class="logo-text">
          <span class="logo-name">IIDZII</span>
          <span class="logo-sub" data-i18n="reader">القارئ</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="lang-switch-home" class="btn-icon lang-btn" aria-label="Switch language" title="English">
          EN
        </button>
        <button id="theme-toggle-home" class="btn-icon theme-btn" aria-label="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="home-main">
      
      <!-- Continue Reading Card -->
      <div id="continue-reading" class="hidden">
        <div class="continue-label" data-i18n="continue_reading">متابعة القراءة</div>
        <div class="continue-card" id="continue-card">
          <div class="continue-cover" id="continue-cover"></div>
          <div class="continue-info">
            <div class="continue-title" id="continue-title"></div>
            <div class="continue-progress-row">
              <div class="continue-bar"><div class="continue-bar-fill" id="continue-bar-fill"></div></div>
              <span class="continue-page" id="continue-page"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Upload Area -->
      <div id="upload-area">
        <div class="upload-frame">
          <div class="upload-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
          </div>
          <h2 class="upload-title" data-i18n="upload_title">اسحب الكتاب هنا</h2>
          <p class="upload-subtitle" data-i18n="upload_subtitle">أو انقر لاختيار ملف</p>
          <input type="file" id="file-input" accept=".txt,.pdf,.docx,.epub" hidden>
          <div class="upload-formats">
            <span>TXT</span><span>PDF</span><span>DOCX</span><span>EPUB</span>
          </div>
        </div>
      </div>

      <!-- Suggestions Section -->
      <div id="suggestions-section">
        <h2 class="section-title" data-i18n="suggested_reading">مقترحات للقراءة</h2>
        <div id="suggestions-grid" class="suggestions-grid">
          <!-- Dynamically populated -->
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer id="home-footer">
      <span>&copy; IIDZII 2025</span>
      <span class="footer-sep">|</span>
      <span data-i18n="footer_tag">قارئ الكتب الإلكترونية</span>
    </footer>
  </div>

  <!-- ==================== READER SCREEN ==================== -->
  <div id="reader-screen" class="hidden">
    
    <!-- Toolbar (auto-hides during reading) -->
    <div id="toolbar">
      <div class="toolbar-start">
        <button id="back-btn" class="btn-icon" aria-label="Back to home" data-i18n-title="back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <span id="book-title" class="toolbar-title"></span>
      </div>
      <div class="toolbar-end">
        <button id="search-btn" class="btn-icon" aria-label="Search in book" data-i18n-title="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button id="toc-btn" class="btn-icon" aria-label="Table of contents" data-i18n-title="toc">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
        </button>
        <button id="bookmark-btn" class="btn-icon" aria-label="Bookmark" data-i18n-title="bookmark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button id="font-btn" class="btn-icon" aria-label="Font settings" data-i18n-title="font_settings">
          <span class="font-btn-text">Aa</span>
        </button>
        <button id="focus-btn" class="btn-icon" aria-label="Focus mode" data-i18n-title="focus_mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
        <button id="theme-toggle-reader" class="btn-icon theme-btn" aria-label="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 0 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button id="lang-switch-reader" class="btn-icon lang-btn" aria-label="Switch language" title="English">
          EN
        </button>
      </div>
    </div>

    <!-- PDF Viewer Container -->
    <div id="pdf-viewer" class="hidden">
      <div id="pdf-container">
        <canvas id="pdf-canvas"></canvas>
      </div>
      <div id="pdf-nav">
        <button id="pdf-prev" class="nav-btn" aria-label="Previous page">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <span id="pdf-page-info">1 / 1</span>
        <button id="pdf-next" class="nav-btn" aria-label="Next page">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button id="pdf-zoom-out" class="nav-btn" aria-label="Zoom out">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
        </button>
        <span id="pdf-zoom-level">100%</span>
        <button id="pdf-zoom-in" class="nav-btn" aria-label="Zoom in">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6M11 8v6"/></svg>
        </button>
      </div>
    </div>

    <!-- Book Viewer Container (TXT/DOCX/EPUB) -->
    <div id="book-viewer" class="hidden">
      <div id="book-content"></div>
    </div>

    <!-- Paginated Navigation (with reading mode toggle) -->
    <div id="page-nav" class="hidden">
      <button id="page-prev" class="nav-btn" aria-label="Previous page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <span id="page-indicator">1 / 1</span>
      <div class="nav-mode-switch">
        <button id="nav-mode-paginated" class="nav-mode-btn active" data-i18n-title="paginated" title="Paginated">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18"/><rect x="14" y="3" width="7" height="18"/></svg>
        </button>
        <button id="nav-mode-continuous" class="nav-mode-btn" data-i18n-title="continuous" title="Continuous">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <button id="page-next" class="nav-btn" aria-label="Next page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <!-- Search Panel -->
    <div id="search-panel" class="hidden">
      <div class="search-input-row">
        <input type="text" id="search-input" placeholder="" data-i18n-placeholder="search_placeholder">
        <button id="search-close" class="btn-icon-sm" aria-label="Close search">&times;</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Font Settings Panel -->
    <div id="font-panel" class="hidden">
      <button id="font-close" class="panel-close" aria-label="Close">&times;</button>
      <div class="font-panel-content">
        <div class="font-row">
          <button id="font-decrease" class="font-btn" aria-label="Decrease font size">A-</button>
          <span id="font-size-display">18</span>
          <button id="font-increase" class="font-btn" aria-label="Increase font size">A+</button>
        </div>
        <div class="font-row">
          <label data-i18n="reading_mode">وضع القراءة</label>
          <div class="mode-switch">
            <button id="mode-paginated" class="mode-btn active" data-i18n="paginated">صفحات</button>
            <button id="mode-continuous" class="mode-btn" data-i18n="continuous">مستمر</button>
          </div>
        </div>
        <div class="font-row">
          <label data-i18n="line_height">ارتفاع السطر</label>
          <input type="range" id="line-height-range" min="1.4" max="2.4" step="0.1" value="1.8">
        </div>
      </div>
    </div>

    <!-- Sidebar (TOC + Bookmarks) -->
    <div id="sidebar-overlay" class="hidden"></div>
    <div id="sidebar" class="hidden">
      <div class="sidebar-header">
        <div class="sidebar-tabs">
          <button id="tab-toc" class="sidebar-tab active" data-i18n="toc">الفهرس</button>
          <button id="tab-bookmarks" class="sidebar-tab" data-i18n="bookmarks">الإشارات</button>
        </div>
        <button id="sidebar-close" class="btn-icon-sm" aria-label="Close sidebar">&times;</button>
      </div>
      <div id="toc-list" class="sidebar-content">
        <!-- Dynamically populated -->
      </div>
      <div id="bookmarks-list" class="sidebar-content hidden">
        <!-- Dynamically populated -->
      </div>
    </div>

  </div>

  <!-- ==================== TOAST CONTAINER ==================== -->
  <div id="toast-container"></div>

  <!-- Main Script -->
  <script src="app.js"></script>
</body>
</html>
